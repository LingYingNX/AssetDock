<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- S0-1:显式 CSP 替代 media: 的 bypassCSP 特权——页面级策略收敛本应用与
         CSS 预览 iframe 各自需要的源;connect-src 放行 media: 保住 fetch 能力 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' media: data: blob:; media-src media: blob:; frame-src 'self' media:; font-src 'self' media: data:; connect-src 'self' media: data: ws: http://localhost:*"
    />
    <title>MediaHub · 素材管理器</title>
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
